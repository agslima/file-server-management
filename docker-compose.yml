services:
  redis:
    image: redis:7.2
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fileengine
      POSTGRES_USER: fileengine
      POSTGRES_PASSWORD: fileengine
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./file-engine/db/migrations:/docker-entrypoint-initdb.d:ro

  file-engine:
    build:
      context: ./file-engine
      dockerfile: build/docker/server.Dockerfile
    ports:
      - "${FILE_ENGINE_HTTP_HOST_PORT:-8080}:8080"
      - "${FILE_ENGINE_GRPC_HOST_PORT:-50051}:50051"
    environment:
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://fileengine:fileengine@postgres:5432/fileengine?sslmode=disable
      FILE_BASE_ROOT: /mnt/files
      STORAGE_BACKEND: local
      JWT_SECRET: dev-secret
      JWT_JWKS_URL: http://keycloak:8080/realms/file-engine/protocol/openid-connect/certs
      JWT_ISSUER: http://localhost:8082/realms/file-engine
      JWT_AUDIENCE: file-engine-dev
      UPLOAD_REQUIRE_CLEAN_SCAN: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - file_data:/mnt/files
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/readyz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  file-engine-worker:
    build:
      context: ./file-engine
      dockerfile: build/docker/worker.Dockerfile
    environment:
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://fileengine:fileengine@postgres:5432/fileengine?sslmode=disable
      FILE_BASE_ROOT: /mnt/files
      STORAGE_BACKEND: local
      JWT_SECRET: dev-secret
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      - redis
      - postgres
      - file-engine
    volumes:
      - file_data:/mnt/files

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    profiles: ["oidc"]
    ports:
      - "8082:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak/dev-realm.json:/opt/keycloak/data/import/dev-realm.json:ro

  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8081"
    environment:
      FILE_ENGINE_URL: http://file-engine:8080/v1
      FILE_ENGINE_BEARER_TOKEN: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJkZXYtYWRtaW4iLCJyb2xlcyI6WyJhZG1pbiJdLCJpc3MiOiJodHRwOi8vbG9jYWxob3N0OjgwODIvcmVhbG1zL2ZpbGUtZW5naW5lIiwiYXVkIjpbImZpbGUtZW5naW5lLWRldiJdfQ.g1qwhSzsMoJxTr7cGVQLspyUBx7fxDswGzx-nmQlNOA
      DB_CONNECTION: sqlite
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
      - backend_storage:/var/www/storage
      - backend_bootstrap_cache:/var/www/bootstrap/cache
    depends_on:
      - file-engine
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8081/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.25
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["observability"]
    ports:
      - "16686:16686"
      - "4319:4317"

volumes:
  redis_data:
  file_data:
  pgdata:
  backend_vendor:
  backend_storage:
  backend_bootstrap_cache:
