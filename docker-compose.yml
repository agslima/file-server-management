version: "3.9"

services:
  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: fileengine
      POSTGRES_USER: fileengine
      POSTGRES_PASSWORD: fileengine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  file-engine:
    build:
      context: ./file-engine
      dockerfile: build/docker/server.Dockerfile
    container_name: file-engine
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://fileengine:fileengine@postgres:5432/fileengine?sslmode=disable
      FILE_BASE_ROOT: /mnt/files
      STORAGE_BACKEND: local
    volumes:
      - file_data:/mnt/files
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/readyz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  file-engine-worker:
    build:
      context: ./file-engine
      dockerfile: build/docker/worker.Dockerfile
    container_name: file-engine-worker
    environment:
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://fileengine:fileengine@postgres:5432/fileengine?sslmode=disable
      FILE_BASE_ROOT: /mnt/files
      STORAGE_BACKEND: local
    depends_on:
      - redis
      - postgres
      - file-engine
    volumes:
      - file_data:/mnt/files

  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "9000:9000"
    environment:
      FILE_ENGINE_URL: http://file-engine:8080/v1
      DB_CONNECTION: sqlite
    volumes:
      - ./backend:/var/www
    depends_on:
      - file-engine

  nginx:
    image: nginx:1.25
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend

volumes:
  redis_data:
  file_data:
  pgdata:
