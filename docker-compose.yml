services:
  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fileengine
      POSTGRES_USER: fileengine
      POSTGRES_PASSWORD: fileengine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./file-engine/db/migrations:/docker-entrypoint-initdb.d:ro

  file-engine:
    build:
      context: ./file-engine
      dockerfile: build/docker/server.Dockerfile
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://fileengine:fileengine@postgres:5432/fileengine?sslmode=disable
      FILE_BASE_ROOT: /mnt/files
      STORAGE_BACKEND: local
      JWT_SECRET: dev-secret
      JWT_JWKS_URL: http://keycloak:8080/realms/file-engine/protocol/openid-connect/certs
      JWT_ISSUER: http://localhost:8082/realms/file-engine
      JWT_AUDIENCE: file-engine-dev
    volumes:
      - file_data:/mnt/files
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/readyz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  file-engine-worker:
    build:
      context: ./file-engine
      dockerfile: build/docker/worker.Dockerfile
    environment:
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://fileengine:fileengine@postgres:5432/fileengine?sslmode=disable
      FILE_BASE_ROOT: /mnt/files
      STORAGE_BACKEND: local
      JWT_SECRET: dev-secret
    depends_on:
      - redis
      - postgres
      - file-engine
    volumes:
      - file_data:/mnt/files

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    profiles: ["oidc"]
    ports:
      - "8082:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak/dev-realm.json:/opt/keycloak/data/import/dev-realm.json:ro

  backend:
    build:
      context: ./backend
    ports:
      - "8081:8081"
    environment:
      FILE_ENGINE_URL: http://file-engine:8080/v1
      FILE_ENGINE_BEARER_TOKEN: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJkZXYtYWRtaW4iLCJyb2xlcyI6WyJhZG1pbiJdfQ.i_BpqphP_nb5kHJmT7ygLysGY87_p40biL0t3SIA26Q
      DB_CONNECTION: sqlite
    volumes:
      - ./backend:/var/www
      - backend_vendor:/var/www/vendor
      - backend_storage:/var/www/storage
      - backend_bootstrap_cache:/var/www/bootstrap/cache
    depends_on:
      - file-engine
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8081/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.25
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend

volumes:
  redis_data:
  file_data:
  pgdata:
  backend_vendor:
  backend_storage:
  backend_bootstrap_cache:
