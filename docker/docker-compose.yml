version: '3.8'

# Legacy/alternate compose file.
# Canonical onboarding paths are:
# - repository root: docker-compose.yml
# - file-engine scope: file-engine/docker-compose.yml

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

  backend:
    build: ../backend
    depends_on:
      - postgres
      - redis
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis

  file-engine:
    build: ../file-engine
    depends_on:
      - backend
      - redis

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - 9000:9000

volumes:
  pgdata:
