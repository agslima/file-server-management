name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
env:
  GOLANG_VERSION: '1.24.x'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend_any_changed }}
      frontend: ${{ steps.filter.outputs.frontend_any_changed }}
      file_engine: ${{ steps.filter.outputs.file_engine_any_changed }}
      docs: ${{ steps.filter.outputs.docs_any_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          
      - uses: tj-actions/changed-files@8cba46e29c11878d930bca7870bb54394d3e8b21 # v47.0.2
        id: filter
        with:
          files_yaml: |
            backend:
              - 'backend/**'
              - '**/*.php'
            frontend:
              - 'frontend/**'
              - 'ui/**'
            file_engine:
              - 'file-engine/**'
              - '**/*.go'
            docs:
              - 'docs/**'
              - '**.md'
              
  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }} 
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: 8.2
      - name: Validate backend baseline
        run: |
          cd backend
          test -f composer.json
          composer validate --strict

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate frontend scaffold baseline
        run: |
          test -f frontend/README.md
          test ! -f frontend/package.json

  file-engine:
    needs: changes
    if: ${{ needs.changes.outputs.file_engine == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          
      - name: Run known-working file-engine dev checks
        run: ./file-engine/scripts/dev.sh
        
      - name: Run gateway route test (explicit)
        run: cd file-engine && go test -race ./internal/server -run TestGatewayCreateFolderAndGetTaskStatusRoutes -v
    
      - name: Ensure generated gateway artifacts are in sync
        run: |
          cd file-engine
          ./scripts/generate_grpc_docker.sh
          cd ..
          git diff --exit-code
          test -z "$(git status --porcelain)"

  doc-drift:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Doc drift check
        run: ./scripts/doc-drift-check.sh

  lint-go:
    name: Lint Go code
    if: ${{ needs.changes.outputs.file_engine == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - changes
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
     
      - name: Setup Golang
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}        
          cache: false 
     
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.9.0 
          args: --timeout=5m --color=always # Prevent CI hanging on heavy lint jobs
          working-directory: file-engine
