name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
      - name: Validate backend baseline
        run: |
          cd backend
          test -f composer.json
          composer validate --strict

  frontend:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate frontend scaffold baseline
        run: |
          test -f frontend/README.md
          test ! -f frontend/package.json

  file-engine:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.24.x
      - name: Run known-working file-engine dev checks
        run: ./file-engine/scripts/dev.sh
      - name: Run gateway route test (explicit)
        run: cd file-engine && go test ./internal/server -run TestGatewayCreateFolderAndGetTaskStatusRoutes -v

  doc-drift:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Doc drift check
        run: ./scripts/doc-drift-check.sh
