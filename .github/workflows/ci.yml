name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
env:
  GOLANG_VERSION: '1.24.x'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Change Detection
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend_any_changed }}
      frontend: ${{ steps.filter.outputs.frontend_any_changed }}
      file_engine: ${{ steps.filter.outputs.file_engine_any_changed }}
      infra: ${{ steps.filter.outputs.infra_any_changed }}
      authz: ${{ steps.filter.outputs.authz_any_changed }}
      monitoring: ${{ steps.filter.outputs.monitoring_any_changed }}
      ledger: ${{ steps.filter.outputs.ledger_any_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          
      - uses: tj-actions/changed-files@7dee1b0c1557f278e5c7dc244927139d78c0e22a # v47.0.4
        id: filter
        with:
          files_yaml: |
            backend:
              - 'backend/**'
              - '**/*.php'
            frontend:
              - 'frontend/**'
              - 'ui/**'
            file_engine:
              - 'file-engine/**'
              - '**/*.go'
            infra:
              - 'docker-compose.yml'
              - 'scripts/ledger-baseline.sh'
              - 'scripts/e2e/**'
              - 'scripts/wait-for-http.sh'
              - 'scripts/wait-for-oidc-token.sh'
              - '.github/workflows/ci.yml'
            authz:
              - 'file-engine/internal/auth*'
              - 'file-engine/internal/authz/**'
              - 'file-engine/tests/integration/**authz**'
            monitoring:
              - 'monitoring/**'
              - 'observability/**'
              - 'file-engine/internal/observability/**'
            ledger:
              - 'docs/capability-ledger.md'
              
  backend:
    name: Test Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }} 
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup PHP
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: 8.2
      - name: Cache Composer cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - name: Validate backend VS-001 baseline contract
        run: |
          cd backend
          test -f composer.json
          composer validate --strict
          php -l app/Http/Controllers/FolderController.php
          php -l app/Http/Controllers/TaskController.php
          php -l app/Services/FileEngineService.php

  lint-backend:
    name: Lint Backend
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup PHP
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: 8.2
      - name: Cache Composer cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-lint-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-lint-
      - name: Install backend dependencies
        run: cd backend && composer install --no-interaction --prefer-dist
      - name: Run PHPStan
        run: cd backend && composer lint

  frontend:
    name: Test Frontend
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate frontend scaffold baseline
        run: |
          test -f frontend/README.md
          test ! -f frontend/package.json

  file-engine:
    name: File Engine Go Checks
    needs: changes
    if: ${{ needs.changes.outputs.file_engine == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      - name: Cache Go module download + build cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ env.GOLANG_VERSION }}-${{ hashFiles('file-engine/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GOLANG_VERSION }}-

      - name: Run known-working file-engine dev checks
        run: ./file-engine/scripts/dev.sh
        
      - name: Run gateway route test (explicit)
        run: cd file-engine && go test -race ./internal/server -run TestGatewayCreateFolderAndGetTaskStatusRoutes -v

      - name: Enforce API compatibility policy + golden fixtures
        run: ./scripts/check-api-compatibility.sh
    
      - name: Ensure generated gateway artifacts are in sync
        run: |
          cd file-engine
          ./scripts/generate_grpc_docker.sh
          cd ..
          git diff --exit-code
          test -z "$(git status --porcelain)"

  lint-go:
    name: Lint Go code
    if: ${{ needs.changes.outputs.file_engine == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - changes
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Golang
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.9.0
          args: --timeout=5m --color=always # Prevent CI hanging on heavy lint jobs
          working-directory: file-engine

  doc-drift:
    name: Doc Drift Check
    needs: changes
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Doc drift check
        run: ./scripts/doc-drift-check.sh

      - name: Doc ownership metadata check
        run: ./scripts/doc-ownership-check.sh

      - name: Architecture conformance check (proto sync + endpoint inventory)
        run: ./scripts/architecture-conformance-check.sh

      - name: OWNERS governance/doc reference check
        run: ./scripts/check-owners-governance.sh

  security-reviewer:
    name: Security reviewer
    needs: changes
    if: ${{ needs.changes.outputs.authz == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate security reviewer rotation references
        run: |
          grep -n "Security reviewer" docs/branch-protection-mapping.md docs/capability-ledger.md
          grep -n "Security" docs/ownership-backup-matrix.md

  platform-reviewer:
    name: Platform reviewer
    needs: changes
    if: ${{ needs.changes.outputs.monitoring == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate platform reviewer rotation references
        run: |
          grep -n "Platform reviewer" docs/branch-protection-mapping.md docs/capability-ledger.md
          grep -n "Platform" docs/ownership-backup-matrix.md

  reviewer-continuity:
    name: Reviewer continuity
    needs: changes
    if: ${{ github.event_name == 'pull_request' && (needs.changes.outputs.authz == 'true' || needs.changes.outputs.monitoring == 'true' || needs.changes.outputs.ledger == 'true') }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Enforce reviewer continuity for critical paths
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-reviewer-continuity.sh

  sustainability-metrics:
    name: Sustainability metrics
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' || needs.changes.outputs.monitoring == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate sustainability markdown report
        run: ./scripts/sustainability-metrics.sh artifacts/sustainability-metrics.md
      - name: Upload sustainability report artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sustainability-metrics-report
          path: artifacts/sustainability-metrics.md

  ledger-baseline:
    name: Ledger Baseline Gate
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.file_engine == 'true' || needs.changes.outputs.infra == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_CL020: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      - name: Cache Go module download + build cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-ledger-${{ env.GOLANG_VERSION }}-${{ hashFiles('file-engine/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-ledger-${{ env.GOLANG_VERSION }}-

      - name: Setup PHP
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2.36.0
        with:
          php-version: 8.2

      - name: Cache Composer cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-ledger-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-ledger-

      - name: Run curated ledger baseline checks
        run: ./scripts/ledger-baseline.sh

  pre-e2e-gate:
    name: Pre-E2E Gate
    needs:
      - changes
      - backend
      - lint-backend
      - frontend
      - file-engine
      - doc-drift
      - ledger-baseline
      - lint-go
    if: ${{ always() }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate prerequisite job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FILE_ENGINE_RESULT: ${{ needs['file-engine'].result }}
          DOC_DRIFT_RESULT: ${{ needs['doc-drift'].result }}
          LEDGER_BASELINE_RESULT: ${{ needs['ledger-baseline'].result }}
          LINT_BACKEND_RESULT: ${{ needs['lint-backend'].result }}
          LINT_GO_RESULT: ${{ needs['lint-go'].result }}
        run: |
          set -euo pipefail

          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::${name} must succeed before E2E. result=${result}"
              exit 1
            fi
          }

          require_success_or_skipped() {
            local name="$1"
            local result="$2"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::${name} must be success or skipped before E2E. result=${result}"
                exit 1
                ;;
            esac
          }

          require_success "changes" "$CHANGES_RESULT"
          require_success "doc-drift" "$DOC_DRIFT_RESULT"

          require_success_or_skipped "backend" "$BACKEND_RESULT"
          require_success_or_skipped "lint-backend" "$LINT_BACKEND_RESULT"
          require_success_or_skipped "frontend" "$FRONTEND_RESULT"
          require_success_or_skipped "file-engine" "$FILE_ENGINE_RESULT"
          require_success_or_skipped "ledger-baseline" "$LEDGER_BASELINE_RESULT"
          require_success_or_skipped "lint-go" "$LINT_GO_RESULT"

          echo "Pre-E2E gate passed."

  cl020-e2e:
    name: CL-020 Docker E2E
    needs:
      - changes
      - pre-e2e-gate
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.file_engine == 'true' || needs.changes.outputs.infra == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run VS-001 docker-compose E2E
        env:
          COMPOSE_PROJECT_NAME: cl020-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          trap 'docker compose down -v --remove-orphans' EXIT
          docker compose build --pull
          docker compose up -d
          ./scripts/wait-for-http.sh http://localhost:8080/readyz 120
          ./scripts/wait-for-http.sh http://localhost:8081/healthz 120
          ./scripts/e2e/vs001_create_folder.sh

  upload-lifecycle-e2e:
    name: Upload Lifecycle E2E
    needs:
      - changes
      - pre-e2e-gate
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.file_engine == 'true' || needs.changes.outputs.infra == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run upload lifecycle docker-compose E2E
        env:
          COMPOSE_PROJECT_NAME: upload-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          trap 'docker compose down -v --remove-orphans' EXIT
          docker compose build --pull file-engine file-engine-worker backend
          docker compose up -d redis postgres file-engine file-engine-worker backend
          ./scripts/wait-for-http.sh http://localhost:8080/readyz 120
          ./scripts/wait-for-http.sh http://localhost:8081/healthz 120
          timeout --signal=TERM 180 ./scripts/e2e/upload_lifecycle.sh

  oidc-e2e:
    name: OIDC Profile E2E
    needs:
      - changes
      - pre-e2e-gate
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.file_engine == 'true' || needs.changes.outputs.infra == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run OIDC docker-compose E2E (bounded)
        env:
          COMPOSE_PROJECT_NAME: oidc-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ./scripts/e2e/run_oidc_profile.sh
