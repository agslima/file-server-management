name: Snyk report update
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 0' # Midnight every Sunday

permissions:
  contents: write # Needed to push the branch
  pull-requests: write # Needed to create the PR

jobs:
  snyk-report:
    name: Update Snyk report in the docs directory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 
        with:
          token: ${{ secrets.GITHUB_PAT }}
          fetch-depth: 0

      - name: Build and Commit Reports
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_PAT }}
        run: |
          # 1. Run the report generation
          make snyk-report
          
          # 2. Check for changes (The "Idempotency" Fix)
          if [[ -z $(git status --porcelain docs/snyk) ]]; then
            echo "✅ No changes to Snyk reports. Skipping PR creation."
            exit 0
          fi

          # 3. Configure Git (Use a generic bot identity)
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --global user.name 'github-actions[bot]'

          # 4. Create Branch
          # Use a timestamp instead of random hash for clearer sorting
          BRANCH_NAME="chore/snyk-report-$(date +%Y%m%d)"
          
          # Delete branch if it exists (cleanup from failed previous runs)
          git push origin --delete "$BRANCH_NAME" || true
          
          git checkout -b "$BRANCH_NAME"
          git add docs/snyk
          git commit -m "docs: Update Snyk security reports [skip ci]" --signoff
          git push origin "$BRANCH_NAME"

          # 5. Create PR (Check if one already exists to avoid dupes)
          if gh pr list --head "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
             echo "PR already exists."
          else
             gh pr create \
               --base main \
               --head "$BRANCH_NAME" \
               --title "docs: Weekly Snyk Security Report Update" \
               --body "This PR updates the Snyk security reports in the docs directory."
          fi
