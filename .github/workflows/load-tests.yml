name: Load Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k6-smoke:
    name: k6 smoke budget gate
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup k6
        uses: grafana/setup-k6-action@ffe7d7290dfa715e48c2ccc924d068444c94bde2 # v1.1.0
      - name: Start load-test stack
        run: docker compose up -d --build redis postgres file-engine file-engine-worker
      - name: Wait for file-engine readiness
        run: ./scripts/wait-for-http.sh http://localhost:8080/readyz 180
      - name: Run smoke budget profile
        env:
          TOKEN_JWT: ${{ secrets.JWT_TOKEN }}
          TOKEN: ${{ secrets.JWT_TOKEN }}
        run: |
          cd file-engine
          BASE_URL=http://localhost:8080 k6 run tests/load/smoke.js
      - name: Shutdown load-test stack
        if: always()
        run: docker compose down -v

  k6-soak:
    name: k6 soak budget gate (nightly)
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup k6
        uses: grafana/setup-k6-action@ffe7d7290dfa715e48c2ccc924d068444c94bde2 # v1.1.0
      - name: Start soak stack
        run: docker compose up -d --build redis postgres file-engine file-engine-worker
      - name: Wait for file-engine readiness
        run: ./scripts/wait-for-http.sh http://localhost:8080/readyz 180
      - name: Run nightly soak budget profile
        env:
          TOKEN_JWT: ${{ secrets.JWT_TOKEN }}
          TOKEN: ${{ secrets.JWT_TOKEN }}
        run: |
          cd file-engine
          BASE_URL=http://localhost:8080 k6 run tests/load/soak.js
      - name: Shutdown soak stack
        if: always()
        run: docker compose down -v
