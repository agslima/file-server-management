name: Load Tests

on:
  push:
    branches:
      - main
      - "pull-request/**"
    tags:
      - 'v*'
  schedule:
    - cron: '0 2 * * *' #  Runs at 02:00
  workflow_dispatch:
    inputs:
      profile:
        description: 'Which k6 profile to run? (smoke, soak, or all)'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - soak
          - all

permissions:
  contents: read

concurrency:
  group: load-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-k6-matrix:
    name: Determine Load Test Profiles
    runs-on: ubuntu-latest
    outputs:
      # Export the JSON array for the next job to consume
      profiles: ${{ steps.set-profiles.outputs.profiles }}
    steps:
      - name: Calculate Matrix
        id: set-profiles
        run: |
          EVENT="${{ github.event_name }}"
          INPUT="${{ inputs.profile }}"
          
          echo "Trigger event: $EVENT"
          
          if [[ "$EVENT" == "schedule" ]]; then
            echo "Routing to SOAK test for scheduled run."
            echo 'profiles=["soak"]' >> "$GITHUB_OUTPUT"
            
          elif [[ "$EVENT" == "push" || "$EVENT" == "pull_request" ]]; then
            echo "Routing to SMOKE test for PR/Push."
            echo 'profiles=["smoke"]' >> "$GITHUB_OUTPUT"
            
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ "$INPUT" != "all" && "$INPUT" != "smoke" && "$INPUT" != "soak" ]]; then
              echo "Invalid manual profile input: '$INPUT'. Allowed values: all, smoke, soak." >&2
              exit 1
            fi

            if [[ "$INPUT" == "all" ]]; then
              echo "Routing to BOTH tests for manual trigger."
              echo 'profiles=["smoke", "soak"]' >> "$GITHUB_OUTPUT"
            else
              echo "Routing to $INPUT test for manual trigger."
              echo "profiles=[\"$INPUT\"]" >> "$GITHUB_OUTPUT"
            fi
            
          else
            # Failsafe fallback
            echo 'profiles=["smoke"]' >> "$GITHUB_OUTPUT"
          fi

  # 2. The Execution: Spawns exactly the jobs we need, with zero "Skipped" clutter
  k6:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: setup-k6-matrix
    name: k6 ${{ matrix.profile }} budget gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        # Parse the JSON string output from the setup job into an actual array
        profile: ${{ fromJson(needs.setup-k6-matrix.outputs.profiles) }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065

      - name: Start load-test stack
        run: docker compose up -d --build redis postgres file-engine file-engine-worker

      - name: Wait for file-engine readiness
        run: ./scripts/wait-for-http.sh http://localhost:8080/readyz 180

      - name: Generate load-test JWT
        id: load-test-jwt
        shell: bash
        run: |
          set -euo pipefail

          # Changed "sub" from "load-test-bot" to "dev-admin"
          token="$(python3 -c 'import base64, hashlib, hmac, json; \
            secret=b"dev-secret"; \
            header={"alg":"HS256","typ":"JWT"}; \
            payload={"sub":"dev-admin","roles":["admin"],"iss":"http://localhost:8082/realms/file-engine","aud":["file-engine-dev"]}; \
            b64=lambda b: base64.urlsafe_b64encode(b).decode().rstrip("="); \
            segments=[b64(json.dumps(header,separators=(",",":")).encode()), b64(json.dumps(payload,separators=(",",":")).encode())]; \
            signing=".".join(segments).encode(); \
            sig=b64(hmac.new(secret, signing, hashlib.sha256).digest()); \
            print(".".join([*segments,sig]))' )"

          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Sanity check auth before k6
        run: |
          set -euo pipefail
          preflight_body="$(mktemp)"
          code="$(curl -sS -o "$preflight_body" -w '%{http_code}' \
            -H "Authorization: Bearer ${{ steps.load-test-jwt.outputs.token }}" \
            'http://localhost:8080/v1/objects?prefix=%2Ftenants%2Facme')"

          if [[ "$code" != "200" && "$code" != "404" ]]; then
            echo "Unexpected auth/list status: $code"
            echo "Preflight response body:"
            cat "$preflight_body"
            docker compose logs --no-color --tail=200 file-engine
            exit 1
          fi

          rm -f "$preflight_body"

          echo "Preflight auth check returned HTTP $code"
         
      - name: Run k6 (${{ matrix.profile }})
        env:
          TOKEN: ${{ steps.load-test-jwt.outputs.token }}
          BASE_URL: http://localhost:8080
          K6_OUT_JSON: k6-${{ matrix.profile }}-results.json
          K6_SUMMARY_JSON: k6-${{ matrix.profile }}-summary.json
        working-directory: file-engine
        run: |
          set -euo pipefail

          # JSON output for post-processing / debugging
          # NOTE: `--out json=...` produces an event stream; useful for deeper analysis.
          k6 run \
            --out "json=${K6_OUT_JSON}" \
            --summary-export "${K6_SUMMARY_JSON}" \
            "tests/load/${{ matrix.profile }}.js"

      - name: Upload k6 artifacts (${{ matrix.profile }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-${{ matrix.profile }}-${{ github.run_id }}
          path: |
            file-engine/k6-${{ matrix.profile }}-results.json
            file-engine/k6-${{ matrix.profile }}-summary.json
          if-no-files-found: warn
          retention-days: 14

      - name: Dump compose logs on failure
        if: failure()
        run: |
          echo "=== docker compose ps ==="
          docker compose ps
          echo "=== docker compose logs (tail) ==="
          docker compose logs --no-color --tail=500 || true

      - name: Shutdown load-test stack
        if: always()
        run: docker compose down -v
