name: Security Scan
on:
  workflow_dispatch: {}
  pull_request:
    branches: ["main"] # Run 'test' (gate) on PRs

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend_any_changed }}
      frontend: ${{ steps.filter.outputs.frontend_any_changed }}
      file-engine: ${{ steps.filter.outputs.file_engine_any_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: tj-actions/changed-files@8cba46e29c11878d930bca7870bb54394d3e8b21 # v47.0.2
        id: filter
        with:
          files_yaml: |
            backend:
              - 'backend/**' 
            frontend:
              - 'frontend/**'
              - 'ui/**'
            file-engine:
              - 'file-engine/**'
              
  snyk-security:
    needs: [changes]
    if: >
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs['file-engine'] == 'true'
      
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
    
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'file-engine/go.mod' # Keep CI Go version aligned with module requirement

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Prepare Go Environment
        run: |
           cd file-engine
           go mod download
           go build ./... || echo "::warning::Build failed, Snyk might fail too"
      
      - name: Run Snyk to check for vulnerabilities
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
           cd file-engine
           snyk test --file=go.mod --severity-threshold=high

      
