name: Security Scan
on:
  workflow_dispatch: {}
  pull_request:
    branches: ["main"] # Run 'test' (gate) on PRs

permissions:
  contents: read

jobs:
  changes:
    name: Change Detection
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend_any_changed }}
      frontend: ${{ steps.filter.outputs.frontend_any_changed }}
      file_engine: ${{ steps.filter.outputs.file_engine_any_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          
      - uses: tj-actions/changed-files@7dee1b0c1557f278e5c7dc244927139d78c0e22a # v47.0.4
        id: filter
        with:
          files_yaml: |
            backend:
              - 'backend/**'
              - '**/*.php'
            frontend:
              - 'frontend/**'
              - 'ui/**'
            file_engine:
              - 'file-engine/**'
              - '**/*.go'
            docs:
              - 'docs/**'
              - '**.md'
              
  snyk-security:
    name: Snyk Security Scan
    needs: [changes]
    if: >
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.file_engine == 'true'
      
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    
      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'file-engine/go.mod' # Keep CI Go version aligned with module requirement

      - name: Install Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Prepare Go Environment
        run: |
           cd file-engine
           go mod download
           go build ./... || echo "::warning::Build failed, Snyk might fail too"
      
      - name: Run Snyk to check for vulnerabilities
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
           cd file-engine
           snyk test --file=go.mod --severity-threshold=high

      
