
# Language Versions
languages:
  go: '1.26.0'
  php: '8.3'
  python: '3.10'

# Build & Package Management
build_tools: {}

# Go Development Tools
go_tools:
  golangci_lint: 'v2.9.0'
  gotestsum: 'v1.13.0'
  gocover_cobertura: 'v1.4.0'
  setup_envtest: 'latest'
  goimports: 'v0.30.0'

# Protocol Buffers / gRPC
protobuf:
  protobuf: 'v33.4'
  protoc_gen_go: 'v1.36.10'
  protoc_gen_go_grpc: 'v1.5.1'
  grpcio_tools: 'v1.78.1'

# Linting & Validation
linting:
  shellcheck: 'v0.11.0'
  addlicense: 'v1.2.0'
  black: '26.1.0'

# Container Tools
container_tools:
  docker_buildx: 'v0.31.1'
  ko: 'v0.18.0'

