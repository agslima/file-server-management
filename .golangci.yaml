version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - bodyclose       # Ensures HTTP response bodies are closed (prevents leaks)
    - errorlint       # Checks for proper error wrapping (fmt.Errorf)
    - exptostd        # Detects libs that have moved to stdlib
    - gocritic        # Extensive checks for bugs and performance
    - gomodguard      # Blocks specific modules
    - gosec           # Security checker (hardcoded creds, weak crypto)
    - govet           # Official Go vetting
    - importas        # Enforces consistent import aliases
    - misspell        # Fixes typos
    - modernize       # Suggests modern Go features
    - noctx           # Finds HTTP requests without context
    - nolintlint      # Checks that //nolint directives are valid
    - perfsprint      # Optimizes fmt.Sprintf usage
    - prealloc        # Suggests pre-allocating slices
    - revive          # Fast, configurable replacement for golint
    - staticcheck     # The gold standard for static analysis
    - testifylint     # Checks for misuse of testify/assert
    - thelper         # Checks for t.Helper() in test helpers
    - tparallel       # Detects inappropriate t.Parallel() usage
    - unparam         # Reports unused function parameters
    - usestdlibvars   # Suggests using variables defined in stdlib
    - usetesting      # Suggests using testing.T features
    - whitespace      # Detection of leading and trailing whitespace

  # v2: test exclusions live under linters.exclusions (NOT issues.*)
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam
          - gosec
          - noctx
          - bodyclose

  settings:
    gocritic:
      enable-all: true
      disabled-checks:
        - appendAssign
        - commentedOutCode
        - deferInLoop
        - exitAfterDefer
        - hugeParam
        - importShadow
        - octalLiteral
        - rangeValCopy
        - unnamedResult
        - whyNoLint

    gomodguard:
      blocked:
        modules:
          - github.com/golang-jwt/jwt/v4:
              recommendations:
                - github.com/golang-jwt/jwt/v5
          - github.com/imdario/mergo:
              recommendations:
                - dario.cat/mergo
              reason: "`github.com/imdario/mergo` has been renamed."
          - github.com/pkg/errors:
              recommendations:
                - errors

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    importas:
      alias:
        - pkg: github.com/golang-jwt/jwt/v5
          alias: jwtgo
        - pkg: k8s.io/api/apps/v1
          alias: appsv1
        - pkg: k8s.io/api/core/v1
          alias: corev1
        - pkg: k8s.io/api/rbac/v1
          alias: rbacv1
        - pkg: k8s.io/apimachinery/pkg/api/errors
          alias: apierrors
        - pkg: k8s.io/apiextensions-apiserver/pkg/apis/apiextensions/v1
          alias: apiextensionsv1
        - pkg: k8s.io/apimachinery/pkg/apis/meta/v1
          alias: metav1
        - pkg: k8s.io/client-go/informers/core/v1
          alias: informersv1
        - pkg: errors
          alias: stderrors
        - pkg: github.com/argoproj/argo-cd/v3/util/io
          alias: utilio

    modernize:
      # v2: modernize uses "disable" (not ignore)
      disable:
        - omitzero
        - newexpr

    nolintlint:
      require-explanation: false
      require-specific: true

    perfsprint:
      int-conversion: true
      err-error: true
      errorf: true
      sprintf1: true
      strconcat: true

    revive:
      rules:
        - name: blank-imports
          disabled: true
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T,testing.TB"
        - name: early-return
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming

    staticcheck:
      checks: ["all", "-SA5011", "-ST1003", "-ST1016"]

    testifylint:
      enable-all: true
      disable:
        - go-require

    usetesting:
      os-mkdir-temp: false

# v2: gofumpt + goimports configuration moved under formatters.settings
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/agslima/file-server-management
    gofumpt:
      extra-rules: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
